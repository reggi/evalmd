name: 'Tests: node.js'

on: [pull_request, push]

permissions:
  contents: read

jobs:
  tests:
    uses: ljharb/actions/.github/workflows/node.yml@main
    with:
      range: '^22.20 || ^24.10 || >= 25'
      type: majors
      build-command: npm run build
      build-output-dir: |
        dist
        dist-test
      command: npm run tests-only --ignore-scripts

  node:
    name: 'node.js'
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - run: true
